version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      # - MONGODB_URI=mongodb://mongo:27017/followupos
      # You can supply other env variables here or use an env_file
    # depends_on:
    #   - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      - server

# Uncomment if you want to run a local MongoDB instance alongside your containers
#   mongo:
#     image: mongo:6
#     ports:
#       - "27017:27017"
#     volumes:
#       - mongo-data:/data/db

