<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FollowUpOS — Authenticating with Google...</title>
    <script>
      // Seamless static fallback: forward query parameters to the SPA index
      const url = new URL(window.location.href);
      window.location.replace('/' + url.search);
    </script>
  </head>
  <body style="background: #08090C; color: #E4E4E7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <div style="width: 32px; height: 32px; border: 3px solid #6366F1; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite;"></div>
      <p style="font-size: 14px; color: #A1A1AA;">Authenticating with Google... Please wait.</p>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
